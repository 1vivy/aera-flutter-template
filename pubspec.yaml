name: surfaces_app
description: "A surfaces app: one Flutter app for KernelSU / WebUI X modules, the web, AERA Recovery and desktop."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  app_native:
    path: rust_builder
  surfaces:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 7294af536411bdfb5166a402d5c9c85b8dad0e5c
      path: packages/surfaces
  surfaces_ui:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 7294af536411bdfb5166a402d5c9c85b8dad0e5c
      path: packages/surfaces_ui
  surfaces_webui:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 7294af536411bdfb5166a402d5c9c85b8dad0e5c
      path: packages/surfaces_webui
  surfaces_aera:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 7294af536411bdfb5166a402d5c9c85b8dad0e5c
      path: packages/surfaces_aera

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  surfaces_cli:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 7294af536411bdfb5166a402d5c9c85b8dad0e5c
      path: tools/cli

flutter:
  uses-material-design: true
